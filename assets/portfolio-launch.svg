<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Wind — personal website launch animation</title>
  <desc id="desc">Animated terminal introducing Wind, an AI Native Product Manager and AI Builder. Click to visit wind-far.github.io.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .line { opacity: 0; animation: reveal 8s ease-in-out infinite; }
    .l1 { animation-delay: .15s; } .l2 { animation-delay: .48s; }
    .l3 { animation-delay: .81s; } .l4 { animation-delay: 1.14s; }
    .l5 { animation-delay: 1.47s; } .l6 { animation-delay: 1.80s; }
    .l7 { animation-delay: 2.13s; } .l8 { animation-delay: 2.46s; }
    .body { fill: #566573; font-size: 16px; }
    .prompt { fill: #3478c9; font-size: 16px; font-weight: 700; }
    .ok { fill: #4aa176; font-weight: 700; }
    .ready { fill: #3478c9; font-size: 17px; font-weight: 700; opacity: 0; animation: ready 8s ease-in-out infinite; }
    .cta { fill: #526273; font-size: 14px; letter-spacing: 1.8px; opacity: 0; animation: launch 8s ease-in-out infinite; }
    .arrow { fill: #3478c9; font-size: 22px; animation: arrow 1.4s ease-in-out infinite; }
    @keyframes reveal { 0%,5% { opacity:0; transform:translateY(5px); } 10%,77% { opacity:1; transform:translateY(0); } 88%,100% { opacity:0; transform:translateY(-2px); } }
    @keyframes ready { 0%,42% { opacity:0; transform:translateY(5px); } 48%,82% { opacity:1; transform:translateY(0); } 92%,100% { opacity:0; } }
    @keyframes launch { 0%,50% { opacity:0; } 57%,84% { opacity:1; } 92%,100% { opacity:0; } }
    @keyframes arrow { 0%,100% { opacity:.35; transform:translateX(0); } 50% { opacity:1; transform:translateX(7px); } }
    @media (prefers-reduced-motion: reduce) { .line,.ready,.cta,.arrow { animation:none; opacity:1; } }
  </style>
  <rect x="1" y="1" width="998" height="518" rx="18" fill="#f8fafb" stroke="#d8e0e7" stroke-width="2"/>
  <path d="M19 2h962a18 18 0 0 1 18 18v31H1V20A18 18 0 0 1 19 2z" fill="#f1f4f6"/>
  <path d="M1 52H999" stroke="#d8e0e7"/>
  <circle cx="24" cy="27" r="7" fill="#ef6461"/>
  <circle cx="47" cy="27" r="7" fill="#efbd4e"/>
  <circle cx="70" cy="27" r="7" fill="#55b96f"/>
  <g class="mono">
    <text x="500" y="31" text-anchor="middle" fill="#9aa7b3" font-size="12" letter-spacing=".8">wind@portfolio — wind-far.github.io — 100×30</text>
    <text class="line l1" x="54" y="93" fill="#526273" font-size="18" font-weight="700">Wind OS — Product thinking, brought to life.</text>
    <text class="body line l2" x="54" y="126">[ <tspan class="ok">OK</tspan> ] Loading product thinking</text>
    <text class="body line l3" x="54" y="157">[ <tspan class="ok">OK</tspan> ] Mounting /users       User problems &amp; insights</text>
    <text class="body line l4" x="54" y="188">[ <tspan class="ok">OK</tspan> ] Mounting /workflows   Agents &amp; human decisions</text>
    <text class="body line l5" x="54" y="219">[ <tspan class="ok">OK</tspan> ] Mounting /build       Prototypes &amp; evaluation</text>
    <text class="prompt line l6" x="54" y="267">wind@portfolio ~ % <tspan class="body">whoami</tspan></text>
    <text class="body line l7" x="54" y="298">Wind · AI Native Product Manager · AI Builder</text>
    <text class="prompt line l8" x="54" y="346">wind@portfolio ~ % <tspan class="body">open https://wind-far.github.io/</tspan></text>
    <text class="ready" x="54" y="389">SYSTEM READY</text>
    <text class="cta" x="500" y="448" text-anchor="middle">CLICK TO LAUNCH · WIND'S PERSONAL WEBSITE</text>
    <text class="arrow" x="500" y="483" text-anchor="middle">→</text>
  </g>
</svg>
